<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungian Dream Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h1 class="display-4">Tell Me Your Dream</h1>

        <form method="POST" class="mx-auto col-md-8 col-lg-6">
            <div class="mb-3">
                <textarea name="prompt" rows="4" class="form-control"
                          placeholder="Enter did you dream" required></textarea>
            </div>
            <div class="d-grid">
                <input type="submit" value="Submit" class="btn btn-primary">
            </div>
        </form>

        {% if result %}
            <h3 class="mt-4">Analysis:</h3>
            <div class="alert alert-secondary">{{ result }}</div>
        {% endif %}

        <!-- {% if image %}
            <h3 class="mt-4">Image:</h3>
            <img src="{{ url_for('static', filename='output.png') }}"
                 class="img-fluid rounded shadow mt-2"
                 style="max-width: 400px; height: auto;"
                 alt="Generated image">
        {% endif %} -->
    </div>
</body>
</html>
